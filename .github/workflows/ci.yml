name: CI

# Runs on pushes and pull requests targeting main. The Docker full-suite job is
# gated to pushes to main because it repeats the native suites inside containers.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# None of these jobs need write access.
permissions:
  contents: read

jobs:
  backend:
    name: Backend (unit + integration)
    runs-on: ubuntu-latest

    services:
      postgres:
        # ECR Public mirror of the Docker Official image avoids Docker Hub
        # anonymous-pull rate limits on GitHub-hosted runners.
        image: public.ecr.aws/docker/library/postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: mystic_auth_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d mystic_auth_ci"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

      redis:
        # Same ECR Public mirror reasoning as postgres.
        image: public.ecr.aws/docker/library/redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

    env:
      # Test-only values, never real secrets. CI provides them directly because
      # there is no checked-in .env file.
      BACKEND_BASE_URL: http://localhost:8000
      FRONTEND_BASE_URL: http://localhost:5173
      FRONTEND_ADDITIONAL_BASE_URLS: ""

      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/mystic_auth_ci
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: mystic_auth_ci

      SECRET_KEY: ci-test-secret-key-not-for-production-use-only

      ACCESS_TOKEN_EXPIRE_MINUTES: "15"
      REFRESH_TOKEN_EXPIRE_MINUTES: "43200"
      JWT_ALGORITHM: HS256
      RESET_TOKEN_EXPIRE_MINUTES: "60"
      ACCOUNT_DELETE_TOKEN_EXPIRE_MINUTES: "60"

      GOOGLE_CLIENT_ID: ci-test-google-client-id
      GOOGLE_CLIENT_SECRET: ci-test-google-client-secret
      GOOGLE_REDIRECT_URI: http://localhost:8000/auth/oauth2/callback/google

      REDIS_URL: redis://localhost:6379/0
      CACHE_DEFAULT_TTL: "300"

      FROM_EMAIL: ci-test@example.com
      GMAIL_APP_PASSWORD: ci-test-app-password
      SUPPORT_EMAIL: ""
      SMTP_HOST: smtp.gmail.com
      SMTP_PORT: "587"

      APP_NAME: MysticAuth

      LOGIN_LOCKOUT_TIME: "300"
      MAX_FAILED_LOGIN_ATTEMPTS: "5"
      LOGIN_LOCKOUT_TIME_PER_IP: "300"
      MAX_FAILED_LOGIN_ATTEMPTS_PER_IP: "20"

      MAX_REQUESTS_PER_WINDOW: "100"
      REQUEST_WINDOW_SECONDS: "60"

      LOG_LEVEL: INFO
      ENVIRONMENT: development
      TRUSTED_PROXY_IPS: ""

      SENTRY_DSN: ""
      SENTRY_ENVIRONMENT: ""

      DEFAULT_APP_POLICIES: ""
      ACCOUNT_PURGE_GRACE_DAYS: "30"

      PYTHONPATH: ${{ github.workspace }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14.6"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: pip install --no-cache-dir -r backend/requirements.txt -r backend/requirements-dev.txt

      - name: Audit Python dependencies for known vulnerabilities
        run: |
          pip install --no-cache-dir pip-audit
          pip-audit -r backend/requirements.txt

      - name: Lint (ruff)
        working-directory: backend
        run: ruff check app mystic_auth alembic ../tests/backend

      - name: Type-check (mypy)
        working-directory: backend
        run: mypy app mystic_auth

      - name: Security scan (bandit)
        working-directory: backend
        run: bandit -r app mystic_auth -c pyproject.toml

      - name: Run database migrations
        working-directory: backend
        run: alembic upgrade head

      # Fails if model columns or indexes drift from checked-in migrations.
      - name: Verify models match migrations (alembic check)
        working-directory: backend
        run: alembic check

      # app/ wrapper tests and mystic_auth unit tests share one coverage base.
      - name: Run backend unit tests
        run: python -m pytest tests/backend/app tests/backend/mystic_auth/unit -q

      # --cov-append makes the final gate cumulative across backend suites.
      - name: Run backend integration tests
        run: python -m pytest tests/backend/mystic_auth/integration -q --cov-append

      # Regression gate. See docs/mystic_auth/testing/overview.md for coverage state.
      - name: Run backend security tests
        run: python -m pytest tests/backend/mystic_auth/security -q --cov-append --cov-fail-under=85

      # Non-blocking because timing can be noisy on shared runners.
      - name: Run backend performance tests (non-blocking)
        continue-on-error: true
        run: python -m pytest tests/backend/mystic_auth/performance -q

  frontend:
    name: Frontend (typecheck + lint + test + build)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # React Router 8 requires Node 22.22.0 or newer.
          node-version: "22.22.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # There is no checked-in frontend/.env; use the fork-configurable
      # defaults from frontend/.env.example so CI reflects whatever a fork
      # has set there, same as the docker-build job does for the root .env.
      - name: Set up frontend .env
        working-directory: frontend
        run: cp .env.example .env

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --legacy-peer-deps

      - name: Audit npm dependencies for known vulnerabilities
        working-directory: frontend
        run: npm audit --audit-level=high

      - name: Type-check
        working-directory: frontend
        run: npm run typecheck

      - name: Lint
        working-directory: frontend
        run: npm run lint

      # test:coverage evaluates vitest.config.ts coverage thresholds.
      - name: Run tests (with coverage threshold gate)
        working-directory: frontend
        run: npm run test:coverage

      - name: Build
        working-directory: frontend
        run: npm run build

  secrets-scan:
    name: Secrets scan (gitleaks)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          # gitleaks scans history, not just the working tree.
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  docker-build:
    name: Docker image build verification
    runs-on: ubuntu-latest

    # Builds both images, then boots and smoke-tests the real dev Compose stack.
    # The full test suite inside containers is handled by docker-full-suite.

    steps:
      - uses: actions/checkout@v4

      # Uses .env.example only to satisfy env_file references.
      - name: Validate docker-compose configs
        run: |
          cp .env.example .env
          docker compose -f docker-compose.yml config > /dev/null
          docker compose -f docker-compose.local-prod.yml config > /dev/null
          docker compose -f docker-compose.prod.yml config > /dev/null
          rm .env

      - name: Build backend image
        run: docker build -f docker/backend.Dockerfile -t backend:ci .

      - name: Build frontend production image
        run: docker build --target production -f docker/frontend.Dockerfile -t frontend:ci .

      # Regression guard for local request logs leaking into the image. /app/logs
      # should exist but be empty.
      - name: Verify no local logs leaked into the backend image
        run: |
          docker run --rm backend:ci sh -c 'test -z "$(ls -A /app/logs 2>/dev/null)"' \
            && echo "OK: /app/logs exists but is empty in the built image" \
            || (echo "FAIL: /app/logs contains files copied into the built image - check .dockerignore" && exit 1)

      # Boots the real dev Compose stack and confirms it serves traffic.
      # Bugsink is not started here, so blank its superuser email to skip the
      # bounded DSN wait in the backend startup command.
      - name: Boot the dev stack
        run: |
          cp .env.example .env
          sed -i 's/^BUGSINK_SUPERUSER_EMAIL=.*/BUGSINK_SUPERUSER_EMAIL=/' .env
          docker compose up -d --build postgres redis alembic backend frontend

      - name: Wait for backend to report healthy
        run: timeout 150 sh -c 'until curl -sf http://localhost:8000/health/ready >/dev/null 2>&1; do sleep 3; done'

      - name: Wait for frontend dev server to respond
        run: timeout 60 sh -c 'until curl -sf http://localhost:5173 >/dev/null 2>&1; do sleep 3; done'

      - name: Smoke-test the booted stack
        run: |
          curl -sf http://localhost:8000/health/ready | grep -q '"status":"ok"' \
            && echo "OK: backend /health/ready reports ok through the actual image"
          curl -sf http://localhost:5173 | grep -qi '<div id="root">' \
            && echo "OK: frontend dev server serves the app shell through the actual image"

      # Prints container logs only when a previous step failed.
      - name: Show container logs (only runs on failure)
        if: failure()
        run: docker compose logs --no-color

      - name: Tear down the dev stack
        if: always()
        run: |
          docker compose down -v
          rm -f .env

  # Re-runs the full suites through the actual Compose stack. This catches
  # container-specific drift and is gated to pushes to main to avoid doubling
  # PR CI time for the same source code.
  docker-full-suite:
    name: Full test suite via Docker (main only)
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      # Same CI-only Bugsink DSN wait shortcut as docker-build.
      - name: Boot the backend stack
        run: |
          cp .env.example .env
          sed -i 's/^BUGSINK_SUPERUSER_EMAIL=.*/BUGSINK_SUPERUSER_EMAIL=/' .env
          docker compose up -d --build postgres redis alembic backend

      - name: Wait for backend to report healthy
        run: timeout 180 sh -c 'until curl -sf http://localhost:8000/health/ready >/dev/null 2>&1; do sleep 3; done'

      # Same tiers and flags as the native backend job, but inside the backend
      # container. --user root lets pytest-cov write coverage output to /repo,
      # the whole-repo bind mount.
      - name: Run the full backend suite inside the backend container
        run: |
          docker compose exec -T --user root backend bash -c '
            cd /repo &&
            python -m pytest tests/backend/app tests/backend/mystic_auth/unit -q &&
            python -m pytest tests/backend/mystic_auth/integration -q --cov-append &&
            python -m pytest tests/backend/mystic_auth/security -q --cov-append --cov-fail-under=85
          '

      - name: Boot the frontend
        run: docker compose up -d --build frontend

      - name: Run the full frontend suite inside the frontend container
        run: docker compose exec -T frontend sh -c "npm run test -- --run"

      # Prints container logs only when a previous step failed.
      - name: Show container logs (only runs on failure)
        if: failure()
        run: docker compose logs --no-color

      - name: Tear down
        if: always()
        run: |
          docker compose down -v
          rm -f .env
