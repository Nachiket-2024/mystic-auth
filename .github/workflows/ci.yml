name: CI

# Runs on pushes and PRs targeting main. The Docker full-suite job only runs
# on pushes to main since it repeats the native suites inside containers.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# None of these jobs need write access.
permissions:
  contents: read

jobs:
  backend:
    name: Backend (unit + integration)
    runs-on: ubuntu-latest

    services:
      postgres:
        # ECR Public mirror of the Docker Official image avoids Docker Hub
        # anonymous-pull rate limits on GitHub-hosted runners.
        image: public.ecr.aws/docker/library/postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: mystic_auth_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d mystic_auth_ci"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

      redis:
        # Same ECR Public mirror reasoning as postgres.
        image: public.ecr.aws/docker/library/redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

    env:
      # Test-only values, never real secrets. CI provides them directly because
      # there is no checked-in .env file.
      BACKEND_BASE_URL: http://localhost:8000
      FRONTEND_BASE_URL: http://localhost:5173
      FRONTEND_ADDITIONAL_BASE_URLS: ""

      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/mystic_auth_ci
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: mystic_auth_ci

      # Least-privilege role created by alembic migration
      # b1e6a9f3c7d2_add_least_privilege_app_role.py. Runs the app/tests
      # under that role instead of the postgres superuser above, so CI
      # actually exercises it.
      APP_DB_PASSWORD: ci-test-app-db-password
      APP_DATABASE_URL: postgresql+asyncpg://mystic_auth_app:ci-test-app-db-password@localhost:5432/mystic_auth_ci

      DB_POOL_SIZE: "5"
      DB_MAX_OVERFLOW: "10"

      SECRET_KEY: ci-test-secret-key-not-for-production-use-only

      ACCESS_TOKEN_EXPIRE_MINUTES: "15"
      REFRESH_TOKEN_EXPIRE_MINUTES: "43200"
      JWT_ALGORITHM: HS256
      JWT_ISSUER: http://localhost:8000
      JWT_AUDIENCE: http://localhost:8000
      RESET_TOKEN_EXPIRE_MINUTES: "60"
      ACCOUNT_DELETE_TOKEN_EXPIRE_MINUTES: "60"

      GOOGLE_CLIENT_ID: ci-test-google-client-id
      GOOGLE_CLIENT_SECRET: ci-test-google-client-secret
      GOOGLE_REDIRECT_URI: http://localhost:8000/auth/oauth2/callback/google

      REDIS_URL: redis://localhost:6379/0
      CACHE_DEFAULT_TTL: "300"

      FROM_EMAIL: ci-test@example.com
      GMAIL_APP_PASSWORD: ci-test-app-password
      SUPPORT_EMAIL: ""
      SMTP_HOST: smtp.gmail.com
      SMTP_PORT: "587"

      APP_NAME: MysticAuth

      LOGIN_LOCKOUT_TIME: "300"
      MAX_FAILED_LOGIN_ATTEMPTS: "5"
      LOGIN_LOCKOUT_TIME_PER_IP: "300"
      MAX_FAILED_LOGIN_ATTEMPTS_PER_IP: "20"

      MAX_REQUESTS_PER_WINDOW: "100"
      REQUEST_WINDOW_SECONDS: "60"

      LOG_LEVEL: INFO
      ENVIRONMENT: development
      TRUSTED_PROXY_IPS: ""

      # Empty = geolocation disabled (see core/geolocation.py); no .mmdb
      # file is available in CI, so session tests exercise the fail-open
      # "Unknown" path rather than a real lookup.
      GEOIP_DB_PATH: ""

      SENTRY_DSN: ""
      SENTRY_ENVIRONMENT: ""

      DEFAULT_APP_POLICIES: ""
      ACCOUNT_PURGE_GRACE_DAYS: "30"
      USER_EXPORT_MAX_ROWS: "50000"

      PYTHONPATH: ${{ github.workspace }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14.6"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: pip install --no-cache-dir -r backend/requirements.txt -r backend/requirements-dev.txt

      - name: Audit Python dependencies for known vulnerabilities
        run: |
          pip install --no-cache-dir pip-audit
          pip-audit -r backend/requirements.txt

      - name: Lint (ruff)
        working-directory: backend
        run: ruff check app mystic_auth alembic ../tests/backend

      - name: Type-check (mypy)
        working-directory: backend
        run: mypy app mystic_auth

      - name: Security scan (bandit)
        working-directory: backend
        run: bandit -r app mystic_auth -c pyproject.toml

      - name: Run database migrations
        working-directory: backend
        run: alembic upgrade head

      # Fails if model columns or indexes drift from checked-in migrations.
      - name: Verify models match migrations (alembic check)
        working-directory: backend
        run: alembic check

      # app/ wrapper tests and mystic_auth unit tests share one coverage base.
      - name: Run backend unit tests
        run: python -m pytest tests/backend/app tests/backend/mystic_auth/unit -q

      # --cov-append makes the final gate cumulative across backend suites.
      - name: Run backend integration tests
        run: python -m pytest tests/backend/mystic_auth/integration -q --cov-append

      # Regression gate. See docs/mystic_auth/testing/overview.md for coverage state.
      - name: Run backend security tests
        run: python -m pytest tests/backend/mystic_auth/security -q --cov-append --cov-fail-under=85

      # Non-blocking because timing can be noisy on shared runners.
      - name: Run backend performance tests (non-blocking)
        continue-on-error: true
        run: python -m pytest tests/backend/mystic_auth/performance -q

  frontend:
    name: Frontend (typecheck + lint + test + build)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # React Router 8 requires Node 22.22.0 or newer.
          node-version: "22.22.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # There is no checked-in frontend/.env; use the fork-configurable
      # defaults from frontend/.env.example so CI reflects whatever a fork
      # has set there, same as the docker-build job does for env/.env.
      - name: Set up frontend .env
        working-directory: frontend
        run: cp .env.example .env

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --legacy-peer-deps

      - name: Audit npm dependencies for known vulnerabilities
        working-directory: frontend
        run: npm audit --audit-level=high

      - name: Type-check
        working-directory: frontend
        run: npm run typecheck

      - name: Lint
        working-directory: frontend
        run: npm run lint

      # test:coverage evaluates vitest.config.ts coverage thresholds.
      - name: Run tests (with coverage threshold gate)
        working-directory: frontend
        run: npm run test:coverage

      - name: Build
        working-directory: frontend
        run: npm run build

  secrets-scan:
    name: Secrets scan (gitleaks)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          # gitleaks scans history, not just the working tree.
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  docker-build:
    name: Docker image build verification
    runs-on: ubuntu-latest

    # Builds both images, then boots and smoke-tests the real dev Compose stack.
    # The full test suite inside containers is handled by docker-full-suite.

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # React Router 8 requires Node 22.22.0 or newer.
          node-version: "22.22.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies for browser tests
        working-directory: frontend
        run: npm ci --legacy-peer-deps

      - name: Install Playwright Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      # Uses the *.example files only to satisfy each compose file's own
      # env_file reference (env/.env, env/.env.local-prod-*, env/.env.prod
      # respectively) and --env-file for build-arg interpolation.
      - name: Validate docker-compose configs
        run: |
          created_env_files="env/.env env/.env.local-prod-cloudflare env/.env.local-prod-ngrok env/.env.local-prod-tailscale env/.env.prod"
          for env_file in $created_env_files; do
            if [ -e "$env_file" ]; then
              echo "::error::Refusing to overwrite existing $env_file"
              exit 1
            fi
          done
          trap 'rm -f $created_env_files' EXIT
          cp env/.env.example env/.env
          cp env/.env.local-prod-cloudflare.example env/.env.local-prod-cloudflare
          cp env/.env.local-prod-ngrok.example env/.env.local-prod-ngrok
          cp env/.env.local-prod-tailscale.example env/.env.local-prod-tailscale
          cp env/.env.prod.example env/.env.prod
          docker compose -f docker/compose/docker-compose.dev.yml --env-file env/.env config > /dev/null
          docker compose -f docker/compose/docker-compose.local-prod-cloudflare.yml --env-file env/.env.local-prod-cloudflare config > /dev/null
          docker compose -f docker/compose/docker-compose.local-prod-ngrok.yml --env-file env/.env.local-prod-ngrok config > /dev/null
          docker compose -f docker/compose/docker-compose.local-prod-tailscale.yml --env-file env/.env.local-prod-tailscale config > /dev/null
          docker compose -f docker/compose/docker-compose.prod.yml --env-file env/.env.prod config > /dev/null

      - name: Build backend image
        run: docker build --target runtime -f docker/dockerfiles/backend.Dockerfile -t backend:ci .

      - name: Build frontend production image
        run: docker build --target production -f docker/dockerfiles/frontend.Dockerfile -t frontend:ci .

      # Regression guard for local request logs leaking into the image. /app/logs
      # should exist but be empty.
      - name: Verify no local logs leaked into the backend image
        run: |
          docker run --rm backend:ci sh -c 'test -z "$(ls -A /app/logs 2>/dev/null)"' \
            && echo "OK: /app/logs exists but is empty in the built image" \
            || (echo "FAIL: /app/logs contains files copied into the built image - check .dockerignore" && exit 1)

      # Boots the real dev Compose stack and confirms it serves traffic.
      # Bugsink is not started here, so blank its superuser email to skip the
      # bounded DSN wait in the backend startup command.
      - name: Boot the dev stack
        run: |
          if [ -e env/.env ]; then
            echo "::error::Refusing to overwrite existing env/.env"
            exit 1
          fi
          cp env/.env.example env/.env
          touch env/.env.ci-created
          sed -i 's/^BUGSINK_SUPERUSER_EMAIL=.*/BUGSINK_SUPERUSER_EMAIL=/' env/.env
          sed -i 's/^EMAIL_ENABLED=.*/EMAIL_ENABLED=false/' env/.env
          docker compose -f docker/compose/docker-compose.dev.yml --env-file env/.env up -d --build postgres redis alembic backend frontend procrastinate_worker

      - name: Wait for backend to report healthy
        run: timeout 150 sh -c 'until curl -sf http://localhost:8000/health/ready >/dev/null 2>&1; do sleep 3; done'

      - name: Wait for frontend dev server to respond
        run: timeout 60 sh -c 'until curl -sf http://localhost:5173 >/dev/null 2>&1; do sleep 3; done'

      - name: Smoke-test the booted stack
        run: |
          curl -sf http://localhost:8000/health/ready | grep -q '"status":"ok"' \
            && echo "OK: backend /health/ready reports ok through the actual image"
          curl -sf http://localhost:5173 | grep -qi '<div id="root">' \
            && echo "OK: frontend dev server serves the app shell through the actual image"

      - name: Run browser E2E tests
        env:
          EMAIL_ENABLED: "false"
        run: npm run test:browser --prefix frontend

      # Prints container logs only when a previous step failed.
      - name: Show container logs (only runs on failure)
        if: failure()
        run: docker compose -f docker/compose/docker-compose.dev.yml --env-file env/.env logs --no-color

      - name: Tear down the dev stack
        if: always()
        run: |
          docker compose -f docker/compose/docker-compose.dev.yml --env-file env/.env down -v
          if [ -f env/.env.ci-created ]; then
            rm -f env/.env env/.env.ci-created
          fi

  # Re-runs the full suites through the actual Compose stack. This catches
  # container-specific drift and is gated to pushes to main to avoid doubling
  # PR CI time for the same source code.
  docker-full-suite:
    name: Full test suite via Docker (main only)
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      # Same CI-only Bugsink DSN wait shortcut as docker-build.
      # BACKEND_BUILD_TARGET=test builds the backend from the Dockerfile's
      # `test` stage so pytest is available inside the container below,
      # without the runtime image everyone else deploys ever shipping test
      # tooling.
      - name: Boot the backend stack
        env:
          BACKEND_BUILD_TARGET: test
        run: |
          if [ -e env/.env ]; then
            echo "::error::Refusing to overwrite existing env/.env"
            exit 1
          fi
          cp env/.env.example env/.env
          touch env/.env.ci-created
          sed -i 's/^BUGSINK_SUPERUSER_EMAIL=.*/BUGSINK_SUPERUSER_EMAIL=/' env/.env
          sed -i 's/^EMAIL_ENABLED=.*/EMAIL_ENABLED=false/' env/.env
          docker compose -f docker/compose/docker-compose.dev.yml --env-file env/.env up -d --build postgres redis alembic backend procrastinate_worker

      - name: Wait for backend to report healthy
        run: timeout 180 sh -c 'until curl -sf http://localhost:8000/health/ready >/dev/null 2>&1; do sleep 3; done'

      # Audit log rows (and every other Procrastinate task) are written by
      # this worker asynchronously, not inline on the request: the audit-log
      # integration suite polls for them (see its own _poll_for_entries), but
      # only succeeds if a worker is actually running to process the queue.
      - name: Wait for procrastinate_worker to report healthy
        run: timeout 60 sh -c 'until [ "$(docker inspect -f "{{.State.Health.Status}}" $(docker compose -f docker/compose/docker-compose.dev.yml --env-file env/.env ps -q procrastinate_worker))" = "healthy" ]; do sleep 3; done'

      # Same tiers and flags as the native backend job, but inside the backend
      # container. --user root lets pytest-cov write coverage output to /repo,
      # the whole-repo bind mount.
      - name: Run the full backend suite inside the backend container
        run: |
          docker compose -f docker/compose/docker-compose.dev.yml --env-file env/.env exec -T --user root backend sh -c '
            export PATH=/opt/venv/bin:$PATH &&
            cd /repo &&
            python -m pytest tests/backend/app tests/backend/mystic_auth/unit -q &&
            python -m pytest tests/backend/mystic_auth/integration -q --cov-append &&
            python -m pytest tests/backend/mystic_auth/security -q --cov-append --cov-fail-under=85
          '

      - name: Boot the frontend
        run: docker compose -f docker/compose/docker-compose.dev.yml --env-file env/.env up -d --build frontend

      - name: Run the full frontend suite inside the frontend container
        run: docker compose -f docker/compose/docker-compose.dev.yml --env-file env/.env exec -T frontend sh -c "npm run test -- --run"

      # Prints container logs only when a previous step failed.
      - name: Show container logs (only runs on failure)
        if: failure()
        run: docker compose -f docker/compose/docker-compose.dev.yml --env-file env/.env logs --no-color

      - name: Tear down
        if: always()
        run: |
          docker compose -f docker/compose/docker-compose.dev.yml --env-file env/.env down -v
          if [ -f env/.env.ci-created ]; then
            rm -f env/.env env/.env.ci-created
          fi
