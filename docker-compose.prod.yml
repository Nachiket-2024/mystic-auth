# ---------------------------- Real Deployment Compose ----------------------------
# Run with: docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --build
# (or use scripts/docker/prod-up.sh / .ps1 / .cmd, which pass that flag for you)
#
# This is the file an actual internet-facing deployment (e.g. a VPS) runs.
# For testing the production-style build locally without deploying anywhere,
# use docker-compose.local-prod.yml instead.
#
# Differences from docker-compose.local-prod.yml:
#   - Adds a Caddy service that terminates TLS (automatic Let's Encrypt certs
#     from PUBLIC_DOMAIN) and is the only container with ports published to
#     the host. See docker/Caddyfile.
#   - postgres, redis, backend, and frontend no longer publish ports to the
#     host at all. They're still reachable container-to-container by service
#     name on the default network (Caddy -> frontend -> backend), so nothing
#     about how requests flow changes, only what a port scan against the
#     host can see. Local debugging convenience (e.g. `psql
#     localhost:5433`) is the tradeoff; use docker-compose.local-prod.yml or
#     `docker compose exec` for that instead.
#   - REDIS_PASSWORD and a real (non-placeholder) SECRET_KEY /
#     POSTGRES_PASSWORD are effectively required here, not just recommended:
#     this file assumes .env.prod holds real production secrets.
#
# Everything else (restart policies, resource limits, healthchecks,
# migration gating) is unchanged from docker-compose.local-prod.yml.
#
# Explicit project name, distinct from docker-compose.yml's "mystic-auth-dev"
# and docker-compose.local-prod.yml's "mystic-auth-local-prod": without
# this, every compose file in this directory defaults to the same project
# name (the directory name) and therefore the same containers, network, and
# named volumes - so this stack and the others would silently share one
# database, and a command meant for one could wipe another's data. See
# docker-compose.yml's matching comment for the incident this guards
# against. A real deployment normally only ever runs one of these three
# files anyway, but naming it explicitly costs nothing and removes the risk
# entirely if that ever changes.
name: mystic-auth-prod

services:

  postgres:
    image: postgres:15
    restart: unless-stopped
    env_file:
      - ./.env.prod
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 1G

  redis:
    image: redis:7
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:-}"]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"${REDIS_PASSWORD:-}\" --no-auth-warning ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M

  backend:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
      target: runtime
    restart: unless-stopped
    env_file:
      - ./.env.prod
    command: |
      sh -c "if [ -n \"$$BUGSINK_SUPERUSER_EMAIL\" ]; then
        for i in $$(seq 1 20); do
          [ -f /shared/bugsink-dsn/backend.env ] && . /shared/bugsink-dsn/backend.env && break
          sleep 0.5
        done
      fi
      exec uvicorn app.main:app --host 0.0.0.0 --port 8000"
    environment:
      DATABASE_URL: ${DATABASE_URL}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      alembic:
        condition: service_completed_successfully
    volumes:
      - bugsink_dsn:/shared/bugsink-dsn:ro
      # Read-only: only geoipupdate (below) writes here. Always mounted, even
      # when the geoip profile isn't enabled - an empty volume just means
      # GEOIP_DB_PATH (if set at all) points at a missing file, which
      # session_geolocation.py already handles by logging once and falling
      # back to "Unknown" (see docs/mystic_auth/security/hardening.md#session-geolocation).
      - geoip_data:/usr/share/GeoIP:ro
    # No host port published; only frontend's nginx (same Docker network)
    # ever needs to reach this service, as backend:8000.
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready')"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 512M

  frontend:
    image: mystic-auth-frontend:prod
    pull_policy: build
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
      target: production
      # VITE_* vars are baked into the static bundle at build time, so they
      # must come from .env.prod as build args (via --env-file; see this
      # file's header). VITE_APP_NAME/VITE_SUPPORT_EMAIL are aliased from
      # the backend APP_NAME/SUPPORT_EMAIL vars rather than duplicated in
      # .env.prod.
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL}
        VITE_APP_NAME: ${APP_NAME}
        VITE_APP_LOGO_URL: ${VITE_APP_LOGO_URL}
        VITE_SUPPORT_EMAIL: ${SUPPORT_EMAIL}
        VITE_SENTRY_DSN: ${VITE_SENTRY_DSN}
        VITE_SENTRY_ENVIRONMENT: ${VITE_SENTRY_ENVIRONMENT}
    # Stable address used by TRUSTED_PROXY_IPS: FastAPI sees this container
    # as the immediate peer for API requests nginx.frontend.conf proxies
    # through. Caddy sits in front of this, appending its own hop to
    # X-Forwarded-For same way; get_client_ip() (backend/mystic_auth/auth/
    # security/client_ip.py) walks the header from the right and discards
    # any entry matching a TRUSTED_PROXY_IPS hop, so Caddy's own pinned
    # address (see the caddy service below) needs to be in that list too,
    # or its hop gets mistaken for the real client.
    networks:
      default:
        ipv4_address: 172.28.0.10
    restart: unless-stopped
    # No host port published; Caddy is the only public entrypoint.
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:80/"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M

  # Terminates TLS and is the only service reachable from outside this host.
  # See docker/Caddyfile. PUBLIC_DOMAIN (required) must already point at
  # this host's public IP in DNS before first start, or certificate
  # issuance fails.
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    env_file:
      - ./.env.prod
    environment:
      PUBLIC_DOMAIN: ${PUBLIC_DOMAIN}
      # Caddy's tls directive (see docker/Caddyfile) requires a real-looking
      # email address; it fails to parse the config entirely if this is
      # blank. Falls back to a syntactically valid placeholder rather than
      # empty, so an unset ACME_EMAIL doesn't crash-loop the container.
      ACME_EMAIL: ${ACME_EMAIL:-you@example.com}
      BUGSINK_PUBLIC_DOMAIN: ${BUGSINK_PUBLIC_DOMAIN:-}
    # Stable address used by TRUSTED_PROXY_IPS (see the frontend service's
    # identical comment above) - lets get_client_ip() tell Caddy's own
    # appended X-Forwarded-For hop apart from the real client's address.
    networks:
      default:
        ipv4_address: 172.28.0.11
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      frontend:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M

  # Runs both background jobs this template has (send_email_task, the daily
  # account-purge cron): Procrastinate's worker process runs its own
  # periodic-task deferrer internally (see
  # docs/mystic_auth/background-workers/procrastinate.md), so unlike taskiq
  # this needs no separate scheduler container/process at all.
  procrastinate_worker:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
      target: runtime
    restart: unless-stopped
    env_file:
      - ./.env.prod
    command: sh -c "procrastinate --app=mystic_auth.procrastinate_tasks.procrastinate_app.app worker"
    environment:
      # The `procrastinate` console-script entrypoint (unlike `python -c` or
      # uvicorn's own sys.path handling) does not add the working directory
      # to sys.path, so without this the app fails to load with "Could not
      # load app from mystic_auth.procrastinate_tasks.procrastinate_app.app"
      # and the container restart-loops. docker-compose.yml (dev) sets this
      # for the same reason.
      PYTHONPATH: /app
    depends_on:
      postgres:
        condition: service_healthy
      alembic:
        condition: service_completed_successfully
    # Override the backend image healthcheck. This container serves no HTTP;
    # `procrastinate healthchecks` instead confirms the app's DB connection
    # works and the procrastinate_jobs table exists, a stronger signal than
    # taskiq's old /proc-grep-for-a-process-name check.
    healthcheck:
      test: ["CMD", "procrastinate", "--app=mystic_auth.procrastinate_tasks.procrastinate_app.app", "healthchecks"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 512M

  alembic:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
      target: runtime
    env_file:
      - ./.env.prod
    command: alembic upgrade head
    environment:
      - DATABASE_URL=${DATABASE_URL}
    depends_on:
      postgres:
        condition: service_healthy

  # Optional. Keeps backend's mounted GeoLite2-City.mmdb (see backend's
  # geoip_data mount above) current, using MaxMind's own official updater
  # instead of a hand-rolled cron script - it re-checks for a new database
  # on its own schedule (GEOIPUPDATE_FREQUENCY, hours) for as long as this
  # container runs. Off by default, matching geolocation itself being off by
  # default: start it with `docker compose -f docker-compose.prod.yml
  # --env-file .env.prod --profile geoip up -d --build` after setting
  # GEOIPUPDATE_ACCOUNT_ID / GEOIPUPDATE_LICENSE_KEY (free MaxMind account)
  # and GEOIP_DB_PATH in .env.prod. See
  # docs/mystic_auth/security/hardening.md#session-geolocation.
  geoipupdate:
    image: ghcr.io/maxmind/geoipupdate:latest
    restart: unless-stopped
    profiles: ["geoip"]
    environment:
      GEOIPUPDATE_ACCOUNT_ID: ${GEOIPUPDATE_ACCOUNT_ID:-}
      GEOIPUPDATE_LICENSE_KEY: ${GEOIPUPDATE_LICENSE_KEY:-}
      GEOIPUPDATE_EDITION_IDS: GeoLite2-City
      GEOIPUPDATE_FREQUENCY: "72"
    volumes:
      - geoip_data:/usr/share/GeoIP
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128M

  bugsink:
    image: bugsink/bugsink:2
    restart: unless-stopped
    env_file:
      - ./.env.prod
    environment:
      SECRET_KEY: ${BUGSINK_SECRET_KEY}
      CREATE_SUPERUSER: ${BUGSINK_SUPERUSER_EMAIL}:${BUGSINK_SUPERUSER_PASSWORD}
      PORT: "8000"
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/bugsink
      BEHIND_HTTPS_PROXY: "true"
      BASE_URL: ${BUGSINK_BASE_URL}
    depends_on:
      postgres:
        condition: service_healthy
    command:
      - monofy
      - bugsink-show-version
      - "&&"
      - bugsink-manage
      - check
      - --deploy
      - --fail-level
      - WARNING
      - "&&"
      - bugsink-manage
      - migrate
      - snappea
      - --database=snappea
      - "&&"
      - bugsink-manage
      - migrate
      - "&&"
      - bugsink-manage
      - prestart
      - "&&"
      - gunicorn
      - --config
      - gunicorn.docker.conf.py
      - --timeout
      - "60"
      - --bind=0.0.0.0:$$PORT
      - --access-logfile
      - "-"
      - bugsink.wsgi
      - "|||"
      - bugsink-runsnappea
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import requests; requests.get('http://localhost:8000/health/ready').raise_for_status()\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 512M

  bugsink-seed:
    image: bugsink/bugsink:2
    user: root
    env_file:
      - ./.env.prod
    environment:
      SECRET_KEY: ${BUGSINK_SECRET_KEY}
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/bugsink
      BASE_URL: ${BUGSINK_BASE_URL}
    depends_on:
      bugsink:
        condition: service_healthy
    volumes:
      - bugsink_dsn:/shared/bugsink-dsn
    command: |
      sh -c "bugsink-manage shell -c \"
      import os
      from django.contrib.auth import get_user_model
      from teams.models import Team, TeamMembership, TeamRole
      from projects.models import Project

      User = get_user_model()
      user = User.objects.get(username=os.environ['BUGSINK_SUPERUSER_EMAIL'])

      team, _ = Team.objects.get_or_create(name='MysticAuth')
      TeamMembership.objects.get_or_create(team=team, user=user, defaults={'role': TeamRole.ADMIN, 'accepted': True})
      project, _ = Project.objects.get_or_create(team=team, name='MysticAuth')

      key = project.sentry_key.hex
      os.makedirs('/shared/bugsink-dsn', exist_ok=True)
      with open('/shared/bugsink-dsn/backend.env', 'w') as f:
          f.write('export SENTRY_DSN=http://' + key + '@bugsink:8000/' + str(project.id) + chr(10))
      print('Seeded Bugsink project ' + str(project.id) + ', key ' + key)
      \""

volumes:
  postgres_data:
  bugsink_dsn:
  # Caddy's certificate/ACME account state. Losing this means re-issuing
  # certs on next start, which Let's Encrypt rate-limits, so it's a named
  # volume (persists across `docker compose down`), not ephemeral.
  caddy_data:
  caddy_config:
  # Shared between geoipupdate (writer, --profile geoip only) and backend
  # (reader, always mounted). Persists across restarts so backend isn't left
  # without a database while geoipupdate re-downloads on its own schedule.
  geoip_data:

networks:
  default:
    ipam:
      config:
        - subnet: 172.28.0.0/24
