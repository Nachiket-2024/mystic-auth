# Real internet-facing deployment (e.g. a VPS). Run with:
#   docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --build
# (or scripts/docker/prod-up.sh/.ps1/.cmd). For a local production-style test
# run without deploying anywhere, use docker-compose.local-prod.yml instead.
#
# Differs from docker-compose.local-prod.yml by adding Caddy (terminates TLS
# via Let's Encrypt using PUBLIC_DOMAIN; the only service with ports on the
# host, see docker/Caddyfile) and publishing no other service's ports to the
# host. REDIS_PASSWORD and a real SECRET_KEY/POSTGRES_PASSWORD are effectively
# required here since .env.prod is assumed to hold real secrets.
#
# Explicit project name: without one, every compose file here would default
# to the same name (the directory name) and thus share containers/network/
# volumes with the others, so a command meant for one stack could wipe
# another's data.
name: mystic-auth-prod

services:

  postgres:
    image: postgres:15
    restart: unless-stopped
    env_file:
      - ./.env.prod
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 1G

  redis:
    image: redis:7
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:-}"]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"${REDIS_PASSWORD:-}\" --no-auth-warning ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M

  backend:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
      target: runtime
    restart: unless-stopped
    env_file:
      - ./.env.prod
    command: |
      sh -c "if [ -n \"$$BUGSINK_SUPERUSER_EMAIL\" ]; then
        for i in $$(seq 1 20); do
          [ -f /shared/bugsink-dsn/backend.env ] && . /shared/bugsink-dsn/backend.env && break
          sleep 0.5
        done
      fi
      exec uvicorn app.main:app --host 0.0.0.0 --port 8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      alembic:
        condition: service_completed_successfully
    volumes:
      - bugsink_dsn:/shared/bugsink-dsn:ro
      # Read-only, only geoipupdate writes here. Safe to mount even when the
      # geoip profile is off: session_geolocation.py falls back to "Unknown"
      # if GEOIP_DB_PATH points at nothing.
      - geoip_data:/usr/share/GeoIP:ro
    # No host port: only frontend's nginx needs to reach backend:8000.
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready')"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 512M

  frontend:
    # Distinct image name so building this doesn't overwrite
    # docker-compose.local-prod.yml's frontend image or docker-compose.yml's.
    image: mystic-auth-prod-frontend
    pull_policy: build
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
      target: production
      # VITE_* vars are baked into the static bundle at build time, so they
      # come from .env.prod as build args (via --env-file). APP_NAME/
      # SUPPORT_EMAIL/BRAND_COLOR are aliased from the backend vars instead
      # of being duplicated.
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL}
        VITE_APP_NAME: ${APP_NAME}
        VITE_APP_LOGO_URL: ${VITE_APP_LOGO_URL}
        VITE_SUPPORT_EMAIL: ${SUPPORT_EMAIL}
        VITE_BRAND_COLOR: ${BRAND_COLOR}
        VITE_SENTRY_DSN: ${VITE_SENTRY_DSN}
        VITE_SENTRY_ENVIRONMENT: ${VITE_SENTRY_ENVIRONMENT}
    # Pinned address for TRUSTED_PROXY_IPS: get_client_ip() needs to know
    # this hop (and Caddy's, below) to find the real client IP in
    # X-Forwarded-For.
    networks:
      default:
        ipv4_address: 172.29.0.10
    restart: unless-stopped
    # No host port published; Caddy is the only public entrypoint.
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:80/"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M

  # Terminates TLS, the only service reachable from outside this host. See
  # docker/Caddyfile. PUBLIC_DOMAIN must already point at this host in DNS
  # before first start, or certificate issuance fails.
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    env_file:
      - ./.env.prod
    environment:
      PUBLIC_DOMAIN: ${PUBLIC_DOMAIN}
      # Caddy's tls directive needs a real-looking email or fails to parse;
      # falls back to a placeholder so an unset ACME_EMAIL doesn't crash-loop.
      ACME_EMAIL: ${ACME_EMAIL:-you@example.com}
      BUGSINK_PUBLIC_DOMAIN: ${BUGSINK_PUBLIC_DOMAIN:-}
    # Pinned address, see the frontend service's TRUSTED_PROXY_IPS comment.
    networks:
      default:
        ipv4_address: 172.29.0.11
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      frontend:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M

  # Runs both background jobs (send_email_task, the daily account-purge
  # cron). Procrastinate's worker runs its own periodic-task scheduler
  # internally, so no separate scheduler container is needed.
  procrastinate_worker:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
      target: runtime
    restart: unless-stopped
    env_file:
      - ./.env.prod
    command: sh -c "procrastinate --app=mystic_auth.procrastinate_tasks.procrastinate_app.app worker"
    environment:
      # The `procrastinate` console-script doesn't add the working directory
      # to sys.path like uvicorn does, so without this the app fails to load
      # and the container restart-loops.
      PYTHONPATH: /app
    depends_on:
      postgres:
        condition: service_healthy
      alembic:
        condition: service_completed_successfully
    # This container serves no HTTP, so `procrastinate healthchecks` checks
    # the DB connection and that the procrastinate_jobs table exists instead.
    healthcheck:
      test: ["CMD", "procrastinate", "--app=mystic_auth.procrastinate_tasks.procrastinate_app.app", "healthchecks"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 512M

  alembic:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
      target: runtime
    env_file:
      - ./.env.prod
    command: alembic upgrade head
    depends_on:
      postgres:
        condition: service_healthy

  # Optional: keeps backend's GeoLite2-City.mmdb current using MaxMind's own
  # updater. Off by default, matching geolocation itself. Start with
  # `--profile geoip` after setting GEOIPUPDATE_ACCOUNT_ID/LICENSE_KEY and
  # GEOIP_DB_PATH. See docs/mystic_auth/security/hardening.md#session-geolocation.
  geoipupdate:
    image: ghcr.io/maxmind/geoipupdate:latest
    restart: unless-stopped
    profiles: ["geoip"]
    environment:
      GEOIPUPDATE_ACCOUNT_ID: ${GEOIPUPDATE_ACCOUNT_ID:-}
      GEOIPUPDATE_LICENSE_KEY: ${GEOIPUPDATE_LICENSE_KEY:-}
      GEOIPUPDATE_EDITION_IDS: GeoLite2-City
      GEOIPUPDATE_FREQUENCY: "72"
    volumes:
      - geoip_data:/usr/share/GeoIP
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128M

  # Scheduled Postgres dumps to ./backups, on by default (unlike geoipupdate
  # below) so a real deployment always has a backup running. Dumps still
  # need copying off this host manually, see
  # docs/mystic_auth/deployment/guide.md#backups. Talks to postgres:5432
  # directly instead of reusing scripts/db/db_backup.sh, which shells out to
  # `docker compose exec` and has no access to the host from in here.
  db_backup:
    image: postgres:15
    restart: unless-stopped
    env_file:
      - ./.env.prod
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_DB: ${POSTGRES_DB}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      # Defaults to once a day, keep two weeks.
      BACKUP_INTERVAL_HOURS: ${BACKUP_INTERVAL_HOURS:-24}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
    volumes:
      # Bind-mounted (not a named volume) so it's the same ./backups
      # directory scripts/db/db_backup.sh and db_restore.sh use.
      - ./backups:/backups
    depends_on:
      postgres:
        condition: service_healthy
    # Plain sleep loop instead of cron, simpler than adding a cron daemon to
    # a stock postgres image. `set -e` makes a failed dump exit and restart
    # (visible in `docker compose ps`/logs) rather than skip silently.
    entrypoint: []
    command: |
      sh -c '
      set -e
      while true; do
        TIMESTAMP="$$(date +%Y%m%d-%H%M%S)"
        DUMP_FILE="/backups/$${POSTGRES_DB}-$${TIMESTAMP}.sql"
        echo "[db_backup] Dumping $${POSTGRES_DB} to $${DUMP_FILE}"
        pg_dump -h postgres -U "$$POSTGRES_USER" "$$POSTGRES_DB" > "$$DUMP_FILE"
        echo "[db_backup] Wrote $${DUMP_FILE} ($$(du -h "$$DUMP_FILE" | cut -f1))"
        find /backups -maxdepth 1 -name "$${POSTGRES_DB}-*.sql" -mtime "+$${BACKUP_RETENTION_DAYS}" -print -delete
        sleep "$$((BACKUP_INTERVAL_HOURS * 3600))"
      done
      '
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M

  bugsink:
    image: bugsink/bugsink:2
    restart: unless-stopped
    env_file:
      - ./.env.prod
    environment:
      SECRET_KEY: ${BUGSINK_SECRET_KEY}
      CREATE_SUPERUSER: ${BUGSINK_SUPERUSER_EMAIL}:${BUGSINK_SUPERUSER_PASSWORD}
      PORT: "8000"
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/bugsink
      BEHIND_HTTPS_PROXY: "true"
      BASE_URL: ${BUGSINK_BASE_URL}
    depends_on:
      postgres:
        condition: service_healthy
    command:
      - monofy
      - bugsink-show-version
      - "&&"
      - bugsink-manage
      - check
      - --deploy
      - --fail-level
      - WARNING
      - "&&"
      - bugsink-manage
      - migrate
      - snappea
      - --database=snappea
      - "&&"
      - bugsink-manage
      - migrate
      - "&&"
      - bugsink-manage
      - prestart
      - "&&"
      - gunicorn
      - --config
      - gunicorn.docker.conf.py
      - --timeout
      - "60"
      - --bind=0.0.0.0:$$PORT
      - --access-logfile
      - "-"
      - bugsink.wsgi
      - "|||"
      - bugsink-runsnappea
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import requests; requests.get('http://localhost:8000/health/ready').raise_for_status()\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 512M

  bugsink-seed:
    image: bugsink/bugsink:2
    user: root
    env_file:
      - ./.env.prod
    environment:
      SECRET_KEY: ${BUGSINK_SECRET_KEY}
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/bugsink
      BASE_URL: ${BUGSINK_BASE_URL}
    depends_on:
      bugsink:
        condition: service_healthy
    volumes:
      - bugsink_dsn:/shared/bugsink-dsn
    command: |
      sh -c "bugsink-manage shell -c \"
      import os
      from django.contrib.auth import get_user_model
      from teams.models import Team, TeamMembership, TeamRole
      from projects.models import Project

      User = get_user_model()
      user = User.objects.get(username=os.environ['BUGSINK_SUPERUSER_EMAIL'])

      team, _ = Team.objects.get_or_create(name='MysticAuth')
      TeamMembership.objects.get_or_create(team=team, user=user, defaults={'role': TeamRole.ADMIN, 'accepted': True})
      project, _ = Project.objects.get_or_create(team=team, name='MysticAuth')

      key = project.sentry_key.hex
      os.makedirs('/shared/bugsink-dsn', exist_ok=True)
      with open('/shared/bugsink-dsn/backend.env', 'w') as f:
          f.write('export SENTRY_DSN=http://' + key + '@bugsink:8000/' + str(project.id) + chr(10))
      print('Seeded Bugsink project ' + str(project.id) + ', key ' + key)
      \""

volumes:
  postgres_data:
  bugsink_dsn:
  # Caddy's cert/ACME state. Losing it means re-issuing certs, which Let's
  # Encrypt rate-limits, so this persists across `docker compose down`.
  caddy_data:
  caddy_config:
  # Shared between geoipupdate (writer) and backend (reader), persists so
  # backend isn't left without a database while geoipupdate re-downloads.
  geoip_data:

networks:
  # Distinct subnet from docker-compose.local-prod.yml's 172.28.0.0/24 so
  # both can run on the same Docker host at once without a pool collision.
  default:
    ipam:
      config:
        - subnet: 172.29.0.0/24
