# Production-style build for a local machine or self-hosted server, exposed
# to the internet through ngrok. Run from the repo root with:
#   docker compose -f docker/compose/docker-compose.local-prod-ngrok.yml --env-file env/.env.local-prod-ngrok up -d --build
# (or scripts/mystic_auth/docker/local-prod-ngrok/local-prod-ngrok-up.sh/.ps1/.cmd).
#
# One of three local-prod variants, differing only in which tunnel exposes
# `frontend` to the internet - see docker-compose.local-prod-cloudflare.yml
# and docker-compose.local-prod-tailscale.yml for the other two, and
# docs/mystic_auth/deployment/local-prod/README.md for the comparison.
#
# Differs from docker-compose.dev.yml (dev) by: no bind mounts (images are
# self-contained), no reload process, frontend builds the `production`
# target (nginx + static build, not the Vite dev server), `restart:
# unless-stopped` and `deploy.resources.limits` on every service.
#
# Public entrypoint is ngrok: outbound tunnel to ngrok's edge (TLS
# terminates there), routed to frontend:80, bound to the free static
# domain in NGROK_DOMAIN. See docs/mystic_auth/deployment/local-prod/ngrok-tunnel.md
# for the one-time account setup this needs.
#
# frontend and backend still publish host ports for local debugging only.
#
# Explicit project name so this stack's containers/network/volumes don't
# collide with the other compose files, including the other local-prod
# variants. Set in env/.env.local-prod-ngrok - see
# docs/mystic_auth/docker/compose-modes.md.
name: ${COMPOSE_PROJECT_NAME}

services:

  ngrok:
    image: ngrok/ngrok:latest
    restart: unless-stopped
    environment:
      NGROK_AUTHTOKEN: ${NGROK_AUTHTOKEN}
    # NGROK_DOMAIN is your account's free static domain (see
    # docs/mystic_auth/deployment/local-prod/ngrok-tunnel.md).
    command: ["http", "frontend:80", "--url=https://${NGROK_DOMAIN}"]
    # Pinned address for TRUSTED_PROXY_IPS, same reasoning as cloudflared's
    # in the other local-prod variants.
    networks:
      default:
        ipv4_address: ${NGROK_STATIC_IP}
    depends_on:
      frontend:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 128M

  postgres:
    image: postgres:15
    restart: unless-stopped
    env_file:
      - ../../env/.env.local-prod-ngrok
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Creates the separate "bugsink" database Bugsink uses, once on a
      # fresh volume.
      - ../postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 2G

  redis:
    image: redis:7
    restart: unless-stopped
    # REDIS_PASSWORD should always be set in production.
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:-}"]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"${REDIS_PASSWORD:-}\" --no-auth-warning ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 512M

  backend:
    build:
      context: ../..
      dockerfile: docker/dockerfiles/backend.Dockerfile
      target: runtime
    restart: unless-stopped
    env_file:
      - ../../env/.env.local-prod-ngrok
    # Overrides env/.env.local-prod-ngrok's own TRUSTED_PROXY_IPS: derived
    # here from FRONTEND_STATIC_IP/NGROK_STATIC_IP so it can never drift
    # out of sync with the actual pinned addresses below.
    environment:
      TRUSTED_PROXY_IPS: ${FRONTEND_STATIC_IP},${NGROK_STATIC_IP}
    # Wait up to ~10s for bugsink-seed to write the (container-to-container)
    # SENTRY_DSN, only when Bugsink is configured.
    command: |
      sh -c "if [ -n \"$$BUGSINK_SUPERUSER_EMAIL\" ]; then
        for i in $$(seq 1 20); do
          [ -f /shared/bugsink-dsn/backend.env ] && . /shared/bugsink-dsn/backend.env && break
          sleep 0.5
        done
      fi
      exec uvicorn app.main:app --host 0.0.0.0 --port 8000 --no-access-log --workers ${UVICORN_WORKERS:-1}"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      alembic:
        condition: service_completed_successfully   # don't serve traffic on an unmigrated schema
    volumes:
      # Read-only: only bugsink-seed writes here.
      - bugsink_dsn:/shared/bugsink-dsn:ro
      # Read-only, only geoipupdate writes here. Safe to mount even when the
      # geoip profile is off: session_geolocation.py falls back to "Unknown"
      # if GEOIP_DB_PATH points at nothing.
      - geoip_data:/usr/share/GeoIP:ro
    ports:
      # Non-default port so this can run alongside dev's backend (8000:8000).
      - "${BACKEND_HOST_PORT}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready')"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 1G

  frontend:
    # Distinct image name (derived from COMPOSE_PROJECT_NAME) so building
    # this doesn't overwrite prod's, dev's, or the other local-prod
    # variants' frontend images, or another mystic-auth fork's.
    image: ${COMPOSE_PROJECT_NAME}-frontend
    # This tag is never published, so without this Compose would try (and
    # fail) to pull it before building, on every run.
    pull_policy: build
    build:
      context: ../..
      dockerfile: docker/dockerfiles/frontend.Dockerfile
      target: production                            # nginx + static build, not the Vite dev server
      # VITE_* vars are baked in at build time from env/.env.local-prod-ngrok.
      # VITE_SENTRY_DSN must be the public Bugsink URL, set manually since
      # bugsink-seed can't infer it. APP_NAME/SUPPORT_EMAIL/BRAND_COLOR are
      # aliased from the backend vars instead of duplicated.
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL}
        VITE_APP_NAME: ${APP_NAME}
        VITE_APP_LOGO_URL: ${VITE_APP_LOGO_URL}
        VITE_APP_FAVICON_URL: ${VITE_APP_FAVICON_URL}
        VITE_SUPPORT_EMAIL: ${SUPPORT_EMAIL}
        VITE_BRAND_COLOR: ${BRAND_COLOR}
        VITE_SENTRY_DSN: ${VITE_SENTRY_DSN}
        VITE_SENTRY_ENVIRONMENT: ${VITE_SENTRY_ENVIRONMENT}
    # Pinned address for TRUSTED_PROXY_IPS: nginx.frontend.conf proxies API
    # prefixes to the backend, so this is the hop the backend needs to trust.
    networks:
      default:
        ipv4_address: ${FRONTEND_STATIC_IP}
    restart: unless-stopped
    ports:
      # Non-default port so this can run alongside prod's Caddy (80/443).
      - "${FRONTEND_HOST_PORT}:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:80/"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 512M

  # Runs both background jobs (send_email_task, the daily account-purge
  # cron). Procrastinate's worker runs its own periodic-task scheduler
  # internally, so no separate scheduler container is needed.
  procrastinate_worker:
    build:
      context: ../..
      dockerfile: docker/dockerfiles/backend.Dockerfile
      target: runtime
    restart: unless-stopped
    env_file:
      - ../../env/.env.local-prod-ngrok
    command: sh -c "procrastinate --app=mystic_auth.procrastinate_tasks.procrastinate_app.app worker"
    environment:
      # The `procrastinate` console-script doesn't add the working directory
      # to sys.path like uvicorn does, so without this the app fails to load
      # and the container restart-loops.
      PYTHONPATH: /app
    depends_on:
      postgres:
        condition: service_healthy
      alembic:
        condition: service_completed_successfully
    # This container serves no HTTP, so `procrastinate healthchecks` checks
    # the DB connection and that the procrastinate_jobs table exists instead.
    healthcheck:
      test: ["CMD", "procrastinate", "--app=mystic_auth.procrastinate_tasks.procrastinate_app.app", "healthchecks"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 1G

  # One-shot migration runner. No restart policy because restarting it
  # would just re-apply an already-applied migration in a loop.
  alembic:
    build:
      context: ../..
      dockerfile: docker/dockerfiles/backend.Dockerfile
      target: runtime
    env_file:
      - ../../env/.env.local-prod-ngrok
    command: alembic upgrade head
    depends_on:
      postgres:
        condition: service_healthy

  # Optional: keeps backend's GeoLite2-City.mmdb current using MaxMind's own
  # updater. Off by default, matching geolocation itself. Start with
  # `--profile geoip` after setting GEOIPUPDATE_ACCOUNT_ID/LICENSE_KEY and
  # GEOIP_DB_PATH. See docs/mystic_auth/geolocation/overview.md.
  geoipupdate:
    image: ghcr.io/maxmind/geoipupdate:latest
    restart: unless-stopped
    profiles: ["geoip"]
    environment:
      GEOIPUPDATE_ACCOUNT_ID: ${GEOIPUPDATE_ACCOUNT_ID:-}
      GEOIPUPDATE_LICENSE_KEY: ${GEOIPUPDATE_LICENSE_KEY:-}
      GEOIPUPDATE_EDITION_IDS: GeoLite2-City
      GEOIPUPDATE_FREQUENCY: "72"
    volumes:
      - geoip_data:/usr/share/GeoIP
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128M

  # Scheduled Postgres custom-format dumps to ./backups, on by default (unlike geoipupdate
  # above). Dumps both POSTGRES_DB (the app) and bugsink (error monitoring),
  # since they're separate databases on the same server. See
  # docker-compose.prod.yml's identical db_backup service and
  # docs/mystic_auth/deployment/migrations-and-backups.md: dumps still need copying
  # off this host manually. Applies here too, since ngrok above can
  # make this a real internet-facing deployment, not just a local test.
  db_backup:
    image: postgres:15
    restart: unless-stopped
    env_file:
      - ../../env/.env.local-prod-ngrok
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_DB: ${POSTGRES_DB}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      BACKUP_INTERVAL_HOURS: ${BACKUP_INTERVAL_HOURS:-24}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
      # Optional: shell command run after each verified dump, with DUMP_FILE
      # exported to it, to ship the dump off-host (see Known Issues: backups
      # are single-point-of-failure without this). Unset by default - dumps
      # stay local-only until an operator opts in. Example:
      # BACKUP_UPLOAD_COMMAND=aws s3 cp "$DUMP_FILE" s3://my-bucket/
      # The postgres:15 image has no aws-cli/rclone preinstalled; use a
      # command already on PATH or bind-mount one in.
      BACKUP_UPLOAD_COMMAND: ${BACKUP_UPLOAD_COMMAND:-}
    volumes:
      - ../../backups:/backups
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint: []
    command: |
      sh -c '
      set -e
      while true; do
        TIMESTAMP="$$(date +%Y%m%d-%H%M%S)"
        for DB in "$$POSTGRES_DB" bugsink; do
          DUMP_FILE="/backups/$${DB}-$${TIMESTAMP}.dump"
          echo "[db_backup] Dumping $${DB} to $${DUMP_FILE}"
          pg_dump -h postgres -U "$$POSTGRES_USER" --format=custom --file="$$DUMP_FILE" "$$DB"
          pg_restore --list "$$DUMP_FILE" >/dev/null
          echo "[db_backup] Wrote $${DUMP_FILE} ($$(du -h "$$DUMP_FILE" | cut -f1))"
          if [ -n "$$BACKUP_UPLOAD_COMMAND" ]; then
            echo "[db_backup] Running BACKUP_UPLOAD_COMMAND for $${DUMP_FILE}"
            DUMP_FILE="$$DUMP_FILE" sh -c "$$BACKUP_UPLOAD_COMMAND"
          fi
          find /backups -maxdepth 1 \( -name "$${DB}-*.dump" -o -name "$${DB}-*.sql" \) -mtime "+$${BACKUP_RETENTION_DAYS}" -print -delete
        done
        sleep "$$((BACKUP_INTERVAL_HOURS * 3600))"
      done
      '
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M

  # Self-hosted error monitoring, on by default in this file too.
  bugsink:
    image: bugsink/bugsink:2
    restart: unless-stopped
    env_file:
      - ../../env/.env.local-prod-ngrok
    environment:
      SECRET_KEY: ${BUGSINK_SECRET_KEY}
      CREATE_SUPERUSER: ${BUGSINK_SUPERUSER_EMAIL}:${BUGSINK_SUPERUSER_PASSWORD}
      PORT: "8000"
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/bugsink
      # Unlike dev, this file assumes a reverse proxy/TLS terminator in front.
      BEHIND_HTTPS_PROXY: "true"
      BASE_URL: ${BUGSINK_BASE_URL}
      # Bugsink (Django) reads its own EMAIL_* names, so this reuses
      # SMTP_HOST/FROM_EMAIL/GMAIL_APP_PASSWORD rather than a second mail
      # account. See docs/mystic_auth/error-monitoring/overview.md.
      EMAIL_HOST: ${SMTP_HOST}
      EMAIL_PORT: ${SMTP_PORT}
      EMAIL_HOST_USER: ${FROM_EMAIL}
      EMAIL_HOST_PASSWORD: ${GMAIL_APP_PASSWORD}
      EMAIL_USE_TLS: "true"
      DEFAULT_FROM_EMAIL: ${FROM_EMAIL}
    # Bound to localhost only: ngrok tunnels the frontend, not Bugsink,
    # which should not be internet-facing. Reach it via localhost:8111 or an
    # SSH tunnel. Non-default port so this can run alongside dev's (8010).
    ports:
      - "127.0.0.1:8111:8000"
    depends_on:
      postgres:
        condition: service_healthy
    # Must stay a YAML list: `monofy`, not a shell, interprets && and |||.
    command:
      - monofy
      - bugsink-show-version
      - "&&"
      - bugsink-manage
      - check
      - --deploy
      - --fail-level
      - WARNING
      - "&&"
      - bugsink-manage
      - migrate
      - snappea
      - --database=snappea
      - "&&"
      - bugsink-manage
      - migrate
      - "&&"
      - bugsink-manage
      - prestart
      - "&&"
      - gunicorn
      - --config
      - gunicorn.docker.conf.py
      - --timeout
      - "60"
      - --bind=0.0.0.0:$$PORT
      - --access-logfile
      - "-"
      - bugsink.wsgi
      - "|||"
      - bugsink-runsnappea
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import requests; requests.get('http://localhost:8000/health/ready').raise_for_status()\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 1G

  # One-shot, idempotent Bugsink project seeder. No restart policy.
  bugsink-seed:
    image: bugsink/bugsink:2
    # Root, since Docker creates a fresh named volume root-owned and the
    # non-root "bugsink" user can't write the DSN file into it otherwise.
    user: root
    env_file:
      - ../../env/.env.local-prod-ngrok
    environment:
      SECRET_KEY: ${BUGSINK_SECRET_KEY}
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/bugsink
      BASE_URL: ${BUGSINK_BASE_URL}
    depends_on:
      bugsink:
        condition: service_healthy
    volumes:
      - bugsink_dsn:/shared/bugsink-dsn
    command: |
      sh -c "bugsink-manage shell -c \"
      import os
      from django.contrib.auth import get_user_model
      from teams.models import Team, TeamMembership, TeamRole
      from projects.models import Project

      User = get_user_model()
      user = User.objects.get(username=os.environ['BUGSINK_SUPERUSER_EMAIL'])

      team, _ = Team.objects.get_or_create(name=os.environ['APP_NAME'])
      TeamMembership.objects.get_or_create(team=team, user=user, defaults={'role': TeamRole.ADMIN, 'accepted': True})
      project, _ = Project.objects.get_or_create(team=team, name=os.environ['APP_NAME'])

      key = project.sentry_key.hex
      os.makedirs('/shared/bugsink-dsn', exist_ok=True)
      with open('/shared/bugsink-dsn/backend.env', 'w') as f:
          f.write('export SENTRY_DSN=http://' + key + '@bugsink:8000/' + str(project.id) + chr(10))
      print('Seeded Bugsink project ' + str(project.id) + ', key ' + key)
      \""

volumes:
  postgres_data:
  # Shared between bugsink-seed (writer) and backend (reader). The frontend
  # doesn't read it since VITE_SENTRY_DSN is a build arg.
  bugsink_dsn:
  # Shared between geoipupdate (writer) and backend (reader), persists so
  # backend isn't left without a database while geoipupdate re-downloads.
  geoip_data:

networks:
  # Known subnet so frontend/ngrok can pin their TRUSTED_PROXY_IPS
  # addresses. Set in env/.env.local-prod-ngrok - change it if another
  # mystic-auth fork's stack on this machine uses the same subnet. See
  # docs/mystic_auth/docker/compose-modes.md.
  default:
    ipam:
      config:
        - subnet: ${DOCKER_SUBNET}
