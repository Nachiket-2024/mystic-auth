# Serves the built React SPA. Non-file paths fall back to index.html so
# client-side routing works on hard refreshes and deep links.
server {
    listen 80;
    server_name _;
    server_tokens off;

    # Per-response CSP nonce. $request_id is 16 random bytes (hex), unique per
    # request, so it is unguessable. See the style-src-elem note below.
    set $csp_nonce $request_id;

    # Nginx-generated client/proxy errors bypass the backend middleware.
    # Route them through private internal locations that attach the same
    # baseline security headers without duplicating headers on normal API
    # responses (proxy_intercept_errors remains off). These must be URI
    # locations, not @named ones: 414 and 431 fail while nginx is still
    # parsing the request line/headers, and a named-location redirect then
    # dies with "empty URI in redirect" and a bare 500.
    error_page 400 /_security_error/400;
    error_page 405 /_security_error/405;
    error_page 408 /_security_error/408;
    error_page 413 /_security_error/413;
    error_page 414 /_security_error/414;
    error_page 429 /_security_error/429;
    error_page 431 /_security_error/431;
    # 494 is nginx's internal code for "request header or cookie too large";
    # it is reported to the client as 400 unless mapped here.
    error_page 494 /_security_error/431;
    error_page 500 /_security_error/500;
    error_page 502 /_security_error/502;
    error_page 503 /_security_error/503;
    error_page 504 /_security_error/504;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Your own location blocks (docker/app/nginx/*.conf) - see that folder's
    # own README. Zero matches is a no-op, not an error, so this is safe
    # even when you haven't added any.
    include /etc/nginx/conf.d/app/*.conf;

    location = /_security_error/400 { internal; include /etc/nginx/snippets/security-error-headers.conf; return 400; }
    location = /_security_error/405 { internal; include /etc/nginx/snippets/security-error-headers.conf; return 405; }
    location = /_security_error/408 { internal; include /etc/nginx/snippets/security-error-headers.conf; return 408; }
    location = /_security_error/413 { internal; include /etc/nginx/snippets/security-error-headers.conf; return 413; }
    location = /_security_error/414 { internal; include /etc/nginx/snippets/security-error-headers.conf; return 414; }
    location = /_security_error/429 { internal; include /etc/nginx/snippets/security-error-headers.conf; return 429; }
    location = /_security_error/431 { internal; include /etc/nginx/snippets/security-error-headers.conf; return 431; }
    location = /_security_error/500 { internal; include /etc/nginx/snippets/security-error-headers.conf; return 500; }
    location = /_security_error/502 { internal; include /etc/nginx/snippets/security-error-headers.conf; return 502; }
    location = /_security_error/503 { internal; include /etc/nginx/snippets/security-error-headers.conf; return 503; }
    location = /_security_error/504 { internal; include /etc/nginx/snippets/security-error-headers.conf; return 504; }

    # Make the shipped frontend dependency notices reachable to users of the
    # production bundle. This directory contains only package license files.
    location ^~ /third-party-notices/ {
        autoindex on;
        autoindex_exact_size off;
        autoindex_localtime off;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;
        add_header Cross-Origin-Embedder-Policy "require-corp" always;
        add_header Content-Security-Policy "default-src 'none'; base-uri 'none'; frame-ancestors 'none'" always;
    }

    # Security headers for the SPA response only (index.html, and its JS/CSS/
    # asset requests) - deliberately scoped to the three locations that
    # actually serve it below, NOT set at server level. add_header is
    # inherited into a location only when that location defines none of its
    # own, so putting these at server level would additionally attach them,
    # unchanged, to the proxied API location's responses below - duplicating
    # backend/mystic_auth/auth/security/security_headers_middleware.py's own
    # copy of this same set of headers on every API response (nginx doesn't
    # strip headers already present on a proxied upstream response, so both
    # sets would ride through together). The backend's copy is the
    # authoritative, route-aware one for its own routes (e.g. its relaxed
    # CSP carve-out for /docs, its production-gated HSTS) - see
    # docs/mystic_auth/security/hardening-http.md.
    #
    # This is less strict than the backend API's policy because the frontend
    # serves HTML, JS, and CSS. connect-src is 'self' rather than the
    # backend's own origin because the API is same-origin-proxied below; a
    # deployment with a cross-origin VITE_API_BASE_URL needs to add that
    # origin here too. HSTS belongs on the TLS terminator (docker/Caddyfile),
    # since this container serves plain HTTP.
    #
    # Repeated verbatim in each SPA-serving location below rather than
    # factored out: add_header has no context above server{} available in
    # this file (it's included into conf.d, not http{} itself, so a shared
    # map/snippet would mean touching the base image's own nginx.conf), and
    # add_header directives don't inherit into a location that defines any
    # add_header of its own - so each location needs its own full copy.
    #
    # The one style-src hash (sha256-59EXsFWitnCXEpMDAX9g2Y4mq6QFNCOPnOJs9rOaSMw=)
    # is current and confirmed: it covers frontend/index.html's boot-shell
    # <style> block (the pre-React "Loading your session" screen). Without
    # this hash, style-src has no 'unsafe-inline'/'unsafe-hashes' entry, so a
    # CSP-enforcing browser silently drops that block's styling and renders
    # the boot shell unstyled (stacked top-left, no brand background) for one
    # frame before React mounts - a real production bug that looked like two
    # different loading screens back to back.
    #
    # style-src-elem allows the boot-shell hash plus a per-response nonce.
    # index.html carries <meta name="csp-nonce" content="__CSP_NONCE__">, which
    # sub_filter rewrites to $csp_nonce in the same response that sets this
    # header; frontend/src/mystic_auth/core/cspNonce.ts reads it. Two Radix
    # internals inject a <style> element at runtime whose content has no fixed
    # hash (react-remove-scroll-bar's scroll lock, whose padding depends on the
    # measured scrollbar width, and the Select viewport's scrollbar reset), so
    # they receive the nonce instead. style-src-elem needs its own 'self'
    # (once specified, it no longer falls back to style-src) and the boot-shell
    # hash for the same reason. There is no style-src-attr allowance: a live
    # sweep of every route found no inline style="" attribute violations, since
    # React sets styles through the CSSOM, which CSP does not restrict. Every
    # SPA response must stay uncacheable (Cache-Control on /index.html), or a
    # cached page would carry a stale nonce.
    #
    # The script-src hash (sha256-AhnS/sycp1tNiDtwM99AbTHuMvWBTng//3HjGeKZRGw=)
    # is the same idea for that file's small synchronous dark-mode-detection
    # <script>, which needs to run (and needs CSP to allow it to run) before
    # #boot-shell paints, to set data-boot-theme without a flash.
    #
    # Regenerate either hash with `sha256sum` (base64, over the exact built
    # <style>...</style> or <script>...</script> contents in
    # frontend/dist/index.html, not the source file - Vite minifies both) if
    # that block's contents are ever edited.

    # The SPA itself owns the bare /users and /rate-limits paths (see
    # frontend/src/app/App.tsx's routes), which collide with the backend
    # prefixes proxied below. Every real API call from the app hits a
    # trailing-slash or sub-path form instead (GET /users/, GET
    # /rate-limits/, /users/{email}, ...), never the bare path, so these
    # exact-match locations are unambiguous: without them, a hard
    # refresh or direct navigation to /users or /rate-limits skipped the
    # SPA entirely and rendered the backend's raw JSON (the full admin
    # user list, in the /users case) instead of index.html. `=` exact
    # matches always win over the regex location below regardless of
    # order, so this reliably wins that collision.
    location = /users {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;
        add_header Cross-Origin-Embedder-Policy "require-corp" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'sha256-AhnS/sycp1tNiDtwM99AbTHuMvWBTng//3HjGeKZRGw='; style-src 'self' 'sha256-59EXsFWitnCXEpMDAX9g2Y4mq6QFNCOPnOJs9rOaSMw='; style-src-elem 'self' 'sha256-59EXsFWitnCXEpMDAX9g2Y4mq6QFNCOPnOJs9rOaSMw=' 'nonce-$csp_nonce'; img-src 'self' data:; connect-src 'self'; base-uri 'self'; form-action 'self'; object-src 'none'; frame-ancestors 'none'" always;
        sub_filter '__CSP_NONCE__' $csp_nonce;
        sub_filter_once off;
        try_files /index.html /index.html;
    }
    location = /rate-limits {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;
        add_header Cross-Origin-Embedder-Policy "require-corp" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'sha256-AhnS/sycp1tNiDtwM99AbTHuMvWBTng//3HjGeKZRGw='; style-src 'self' 'sha256-59EXsFWitnCXEpMDAX9g2Y4mq6QFNCOPnOJs9rOaSMw='; style-src-elem 'self' 'sha256-59EXsFWitnCXEpMDAX9g2Y4mq6QFNCOPnOJs9rOaSMw=' 'nonce-$csp_nonce'; img-src 'self' data:; connect-src 'self'; base-uri 'self'; form-action 'self'; object-src 'none'; frame-ancestors 'none'" always;
        sub_filter '__CSP_NONCE__' $csp_nonce;
        sub_filter_once off;
        try_files /index.html /index.html;
    }

    # Always revalidate the SPA entrypoint so an already-open browser cannot
    # keep pointing at an older hashed JS bundle after a frontend deploy.
    # Hashed assets remain cacheable by the browser; only this small manifest
    # needs to be fresh.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;
        add_header Cross-Origin-Embedder-Policy "require-corp" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'sha256-AhnS/sycp1tNiDtwM99AbTHuMvWBTng//3HjGeKZRGw='; style-src 'self' 'sha256-59EXsFWitnCXEpMDAX9g2Y4mq6QFNCOPnOJs9rOaSMw='; style-src-elem 'self' 'sha256-59EXsFWitnCXEpMDAX9g2Y4mq6QFNCOPnOJs9rOaSMw=' 'nonce-$csp_nonce'; img-src 'self' data:; connect-src 'self'; base-uri 'self'; form-action 'self'; object-src 'none'; frame-ancestors 'none'" always;
        sub_filter '__CSP_NONCE__' $csp_nonce;
        sub_filter_once off;
        try_files /index.html /index.html;
    }

    # Proxy only the backend route prefixes registered in backend/app/main.py.
    # This keeps frontend and API traffic on one origin when VITE_API_BASE_URL
    # is empty. $proxy_add_x_forwarded_for preserves an upstream proxy chain,
    # and the backend trusts it only when TRUSTED_PROXY_IPS includes this
    # container's address.
    #
    # Deliberately no add_header here: this location's responses are the
    # backend's own, whose SecurityHeadersMiddleware already sets this same
    # set of headers per-route (see the comment above location = /users).
    location ~ ^/(auth|audit|users|authorization|health|rate-limits)(/|$) {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # auth/session-events is long-lived SSE, so buffering and short idle
        # timeouts would delay events or cut the connection.
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }

    location / {
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;
        add_header Cross-Origin-Embedder-Policy "require-corp" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'sha256-AhnS/sycp1tNiDtwM99AbTHuMvWBTng//3HjGeKZRGw='; style-src 'self' 'sha256-59EXsFWitnCXEpMDAX9g2Y4mq6QFNCOPnOJs9rOaSMw='; style-src-elem 'self' 'sha256-59EXsFWitnCXEpMDAX9g2Y4mq6QFNCOPnOJs9rOaSMw=' 'nonce-$csp_nonce'; img-src 'self' data:; connect-src 'self'; base-uri 'self'; form-action 'self'; object-src 'none'; frame-ancestors 'none'" always;
        sub_filter '__CSP_NONCE__' $csp_nonce;
        sub_filter_once off;
        try_files $uri $uri/ /index.html;
    }
}
