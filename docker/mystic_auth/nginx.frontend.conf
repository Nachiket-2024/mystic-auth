# Access log without query strings. The Google sign-in callback arrives as
# /auth/oauth2/callback/google?code=...&state=..., and the default format
# writes the whole request line, so the one-time authorization code and state
# would land in the container log. $path_only is the original path without the
# query string (unlike $uri, it is not rewritten to /index.html). The referer is
# left out for the same reason.
map $request_uri $path_only {
    ~^(?<p>[^?]*) $p;
    default       $request_uri;
}

log_format no_query '$remote_addr - $remote_user [$time_local] '
                    '"$request_method $path_only $server_protocol" $status $body_bytes_sent '
                    '"$http_user_agent" rid=$request_id';

# Serves the built React SPA. Non-file paths fall back to index.html so
# client-side routing works on hard refreshes and deep links.
server {
    listen 80;
    server_name _;
    server_tokens off;
    access_log /dev/stdout no_query;

    # Per-response CSP nonce. $request_id is 16 random bytes (hex), unique per
    # request, so it is unguessable. See the style-src-elem note below.
    set $csp_nonce $request_id;

    # Nginx-generated client/proxy errors bypass the backend middleware.
    # Route them through private internal locations that attach the same
    # baseline security headers without duplicating headers on normal API
    # responses (proxy_intercept_errors remains off). These must be URI
    # locations, not @named ones: 414 and 431 fail while nginx is still
    # parsing the request line/headers, and a named-location redirect then
    # dies with "empty URI in redirect" and a bare 500.
    error_page 400 /_security_error/400;
    error_page 405 /_security_error/405;
    error_page 408 /_security_error/408;
    error_page 413 /_security_error/413;
    error_page 414 /_security_error/414;
    error_page 404 /_security_error/404;
    error_page 429 /_security_error/429;
    error_page 431 /_security_error/431;
    # 494 is nginx's internal code for "request header or cookie too large";
    # it is reported to the client as 400 unless mapped here.
    error_page 494 /_security_error/431;
    error_page 500 /_security_error/500;
    error_page 502 /_security_error/502;
    error_page 503 /_security_error/503;
    error_page 504 /_security_error/504;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Your own location blocks (docker/app/nginx/*.conf) - see that folder's
    # own README. Zero matches is a no-op, not an error, so this is safe
    # even when you haven't added any.
    include /etc/nginx/conf.d/app/*.conf;

    location = /_security_error/400 { internal; include /etc/nginx/snippets/security-error-headers.conf; return 400; }
    location = /_security_error/404 { internal; include /etc/nginx/snippets/security-error-headers.conf; return 404; }
    location = /_security_error/405 { internal; include /etc/nginx/snippets/security-error-headers.conf; return 405; }
    location = /_security_error/408 { internal; include /etc/nginx/snippets/security-error-headers.conf; return 408; }
    location = /_security_error/413 { internal; include /etc/nginx/snippets/security-error-headers.conf; return 413; }
    location = /_security_error/414 { internal; include /etc/nginx/snippets/security-error-headers.conf; return 414; }
    location = /_security_error/429 { internal; include /etc/nginx/snippets/security-error-headers.conf; return 429; }
    location = /_security_error/431 { internal; include /etc/nginx/snippets/security-error-headers.conf; return 431; }
    location = /_security_error/500 { internal; include /etc/nginx/snippets/security-error-headers.conf; return 500; }
    location = /_security_error/502 { internal; include /etc/nginx/snippets/security-error-headers.conf; return 502; }
    location = /_security_error/503 { internal; include /etc/nginx/snippets/security-error-headers.conf; return 503; }
    location = /_security_error/504 { internal; include /etc/nginx/snippets/security-error-headers.conf; return 504; }

    # Make the shipped frontend dependency notices reachable to users of the
    # production bundle. This directory contains only package license files.
    location ^~ /third-party-notices/ {
        autoindex on;
        autoindex_exact_size off;
        autoindex_localtime off;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;
        add_header Cross-Origin-Embedder-Policy "require-corp" always;
        add_header Content-Security-Policy "default-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
    }

    # Security headers for the SPA only, repeated in each of the three
    # locations that serve it. They are not set at server level because
    # add_header is inherited into a location that defines none of its own, so
    # the proxied API location would get a second copy next to the backend's
    # own (route-aware) headers. They are repeated rather than shared because
    # this file is included into conf.d, not http{}, and add_header does not
    # inherit into a location that has its own add_header. See
    # docs/mystic_auth/security/hardening-http.md.
    #
    # Less strict than the API policy because this serves HTML, JS and CSS.
    # connect-src is 'self' since the API is proxied same-origin; a deployment
    # with a cross-origin VITE_API_BASE_URL must add that origin. HSTS belongs
    # on the TLS terminator (docker/mystic_auth/Caddyfile), not here.
    #
    # CSP hashes:
    # - style-src sha256-59EXsF... covers the boot-shell <style> in
    #   frontend/index.html. Without it the shell renders unstyled for a frame.
    # - script-src sha256-AhnS/... covers the small dark-mode <script> that must
    #   run before the boot shell paints.
    # Regenerate with `sha256sum` over the exact built <style>/<script>
    # contents in frontend/dist/index.html (Vite minifies both) whenever that
    # block changes.
    #
    # style-src-elem allows the boot-shell hash plus a per-response nonce.
    # sub_filter rewrites __CSP_NONCE__ in index.html's csp-nonce meta tag to
    # $csp_nonce, and frontend/src/mystic_auth/core/cspNonce.ts reads it. Radix
    # injects two runtime <style> elements with no fixed hash (the scroll lock
    # and the Select viewport reset), so they use the nonce. style-src-elem
    # needs its own 'self' and the boot-shell hash because it no longer falls
    # back to style-src once set. There is no style-src-attr allowance: React
    # sets styles through the CSSOM, which CSP does not restrict. SPA responses
    # must stay uncacheable, or a cached page would carry a stale nonce.

    # The SPA itself owns the bare /users and /rate-limits paths (see
    # frontend/src/app/App.tsx's routes), which collide with the backend
    # prefixes proxied below. Every real API call from the app hits a
    # trailing-slash or sub-path form instead (GET /users/, GET
    # /rate-limits/, /users/{email}, ...), never the bare path, so these
    # exact-match locations are unambiguous: without them, a hard
    # refresh or direct navigation to /users or /rate-limits skipped the
    # SPA entirely and rendered the backend's raw JSON (the full admin
    # user list, in the /users case) instead of index.html. `=` exact
    # matches always win over the regex location below regardless of
    # order, so this reliably wins that collision.
    location = /users {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;
        add_header Cross-Origin-Embedder-Policy "require-corp" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'sha256-AhnS/sycp1tNiDtwM99AbTHuMvWBTng//3HjGeKZRGw='; style-src 'self' 'sha256-59EXsFWitnCXEpMDAX9g2Y4mq6QFNCOPnOJs9rOaSMw='; style-src-elem 'self' 'sha256-59EXsFWitnCXEpMDAX9g2Y4mq6QFNCOPnOJs9rOaSMw=' 'nonce-$csp_nonce'; img-src 'self' data:; connect-src 'self'; base-uri 'self'; form-action 'self'; object-src 'none'; frame-ancestors 'none'" always;
        sub_filter '__CSP_NONCE__' $csp_nonce;
        sub_filter_once off;
        try_files /index.html /index.html;
    }
    location = /rate-limits {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;
        add_header Cross-Origin-Embedder-Policy "require-corp" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'sha256-AhnS/sycp1tNiDtwM99AbTHuMvWBTng//3HjGeKZRGw='; style-src 'self' 'sha256-59EXsFWitnCXEpMDAX9g2Y4mq6QFNCOPnOJs9rOaSMw='; style-src-elem 'self' 'sha256-59EXsFWitnCXEpMDAX9g2Y4mq6QFNCOPnOJs9rOaSMw=' 'nonce-$csp_nonce'; img-src 'self' data:; connect-src 'self'; base-uri 'self'; form-action 'self'; object-src 'none'; frame-ancestors 'none'" always;
        sub_filter '__CSP_NONCE__' $csp_nonce;
        sub_filter_once off;
        try_files /index.html /index.html;
    }

    # Always revalidate the SPA entrypoint so an already-open browser cannot
    # keep pointing at an older hashed JS bundle after a frontend deploy.
    # Hashed assets remain cacheable by the browser; only this small manifest
    # needs to be fresh.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;
        add_header Cross-Origin-Embedder-Policy "require-corp" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'sha256-AhnS/sycp1tNiDtwM99AbTHuMvWBTng//3HjGeKZRGw='; style-src 'self' 'sha256-59EXsFWitnCXEpMDAX9g2Y4mq6QFNCOPnOJs9rOaSMw='; style-src-elem 'self' 'sha256-59EXsFWitnCXEpMDAX9g2Y4mq6QFNCOPnOJs9rOaSMw=' 'nonce-$csp_nonce'; img-src 'self' data:; connect-src 'self'; base-uri 'self'; form-action 'self'; object-src 'none'; frame-ancestors 'none'" always;
        sub_filter '__CSP_NONCE__' $csp_nonce;
        sub_filter_once off;
        try_files /index.html /index.html;
    }

    # /health/ready reports database/valkey/geoip connectivity - useful to
    # whoever operates this stack, not to the public internet reachable
    # through the tunnel in front of this proxy. Docker's own healthcheck
    # (see docker-compose.*.yml) hits backend:8000 directly, container to
    # container, never through this nginx, so blocking it here doesn't
    # affect orchestration. An exact match always wins over the regex
    # location below regardless of file order, so this can't be bypassed
    # by that broader /health prefix match. /health (plain liveness, no
    # dependency detail) is intentionally left reachable through it.
    location = /health/ready {
        return 404;
    }

    # Proxy only the backend route prefixes registered in backend/app/main.py.
    # This keeps frontend and API traffic on one origin when VITE_API_BASE_URL
    # is empty. $proxy_add_x_forwarded_for preserves an upstream proxy chain,
    # and the backend trusts it only when TRUSTED_PROXY_IPS includes this
    # container's address.
    #
    # Deliberately no add_header here: this location's responses are the
    # backend's own, whose SecurityHeadersMiddleware already sets this same
    # set of headers per-route (see the comment above location = /users).
    location ~ ^/(auth|audit|users|authorization|health|rate-limits)(/|$) {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # auth/session-events is long-lived SSE, so buffering and short idle
        # timeouts would delay events or cut the connection.
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }

    # Static-looking paths must 404 when the file is missing. Falling back to
    # index.html for them (the SPA rule in `location /` below) answered a
    # missing script, robots.txt or security.txt with an HTML page and status
    # 200, which breaks caches and scanners and hides real deploy mistakes. A
    # real file is served with the same security headers as the SPA.
    #
    # /assets/ holds Vite's build output, and every file name carries a hash of
    # its content, so a file never changes under the same name: cache it for a
    # year and skip revalidation. index.html (which names the current hashes)
    # stays uncacheable above and in `location /`.
    location ~ ^/assets/ {
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;
        add_header Cross-Origin-Embedder-Policy "require-corp" always;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location ~ ^/(robots\.txt$|\.well-known/) {
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;
        add_header Cross-Origin-Embedder-Policy "require-corp" always;
        add_header Cache-Control "public, max-age=3600" always;
        try_files $uri =404;
    }

    location / {
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;
        add_header Cross-Origin-Embedder-Policy "require-corp" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'sha256-AhnS/sycp1tNiDtwM99AbTHuMvWBTng//3HjGeKZRGw='; style-src 'self' 'sha256-59EXsFWitnCXEpMDAX9g2Y4mq6QFNCOPnOJs9rOaSMw='; style-src-elem 'self' 'sha256-59EXsFWitnCXEpMDAX9g2Y4mq6QFNCOPnOJs9rOaSMw=' 'nonce-$csp_nonce'; img-src 'self' data:; connect-src 'self'; base-uri 'self'; form-action 'self'; object-src 'none'; frame-ancestors 'none'" always;
        sub_filter '__CSP_NONCE__' $csp_nonce;
        sub_filter_once off;
        try_files $uri $uri/ /index.html;
    }
}
